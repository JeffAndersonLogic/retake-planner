name: Validate

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No npm install: the offline checks need nothing but Node.
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx --no-install playwright-core install --with-deps chromium
      - run: PW_CHROME="$(node -e "console.log(require('playwright-core').chromium.executablePath())")" npm run test:browser
